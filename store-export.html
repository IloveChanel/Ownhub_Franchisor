<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Buscemi's — Export / Accounting</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito+Sans:wght@400;600;700;800&family=Yellowtail&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/ownhub.css" />
</head>
<body>
  <div id="shell"></div>
  <main class="page">
    <section class="panel">
      <h2>Export / Accounting</h2>
      <p class="desc">Same store-level export the franchisee uses. Filter the ticket list and download a CSV.</p>
      <div class="form-grid">
        <div><label>From</label><input type="date" id="from" value="2026-09-01" /></div>
        <div><label>To</label><input type="date" id="to" value="2026-09-14" /></div>
        <div>
          <label>Fulfillment</label>
          <select id="fulfill">
            <option value="">All</option>
            <option value="pickup">Pickup</option>
            <option value="delivery">Delivery</option>
          </select>
        </div>
        <div style="display:flex;align-items:flex-end"><button class="btn btn-wood btn-sm" type="button" onclick="render()">Apply</button></div>
      </div>
      <div class="kpi-row" id="stats" style="margin-top:16px"></div>
      <div style="overflow-x:auto">
        <table>
          <thead><tr><th>Order</th><th>Date</th><th>Customer</th><th>Fulfill</th><th>Total</th><th>Status</th></tr></thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
      <div class="actions" style="margin-top:16px">
        <button class="btn btn-red btn-sm" type="button" onclick="csv()">Download CSV</button>
      </div>
    </section>
  </main>
  <script src="js/app.js"></script>
  <script>
    if (!OwnHub.requireAuth()) throw new Error("auth");
    const id = OwnHub.qs("id") || "HARRISON-001";
    const store = OwnHub.findStore(id) || { id, name: OwnHub.qs("name") || "Harrison Township", status: "live" };
    document.getElementById("shell").innerHTML = OwnHub.storeHeader(store, "export");
    const orders = OwnHub.ordersFor(store.id);
    let view = orders.slice();

    function render() {
      const f = document.getElementById("fulfill").value;
      view = orders.filter(o => !f || o.fulfill === f);
      const total = view.reduce((a, o) => a + o.total, 0);
      document.getElementById("stats").innerHTML = `
        <div class="kpi"><div class="lbl">Orders</div><div class="num">${view.length}</div></div>
        <div class="kpi"><div class="lbl">Revenue</div><div class="num">${OwnHub.money2(total)}</div></div>
        <div class="kpi"><div class="lbl">Average</div><div class="num">${OwnHub.money2(view.length ? total / view.length : 0)}</div></div>
        <div class="kpi"><div class="lbl">Store</div><div class="num" style="font-size:18px">${store.id}</div></div>`;
      document.getElementById("rows").innerHTML = view.map(o => `
        <tr>
          <td>#${o.id}</td><td>${o.date} ${o.time}</td><td>${o.customer}</td>
          <td>${o.fulfill}</td><td>${OwnHub.money2(o.total)}</td>
          <td><span class="badge ${o.status}">${o.status}</span></td>
        </tr>`).join("");
    }
    function csv() {
      const header = "id,date,time,customer,fulfill,total,status";
      const body = view.map(o => [o.id, o.date, o.time, o.customer, o.fulfill, o.total, o.status].join(",")).join("\n");
      const a = document.createElement("a");
      a.href = URL.createObjectURL(new Blob([header + "\n" + body], { type: "text/csv" }));
      a.download = store.id + "-orders.csv";
      a.click();
    }
    render();
  </script>
</body>
</html>
