<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Buscemi's — Menu Items</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito+Sans:wght@400;600;700;800&family=Yellowtail&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/ownhub.css" />
</head>
<body>
  <div id="shell"></div>
  <main class="page">
    <section class="panel">
      <h2>Current menu</h2>
      <p class="desc">This is the same menu screen the franchisee uses.</p>
      <div id="list"></div>
    </section>
    <section class="panel">
      <h2>Add a new item</h2>
      <form class="form-grid" onsubmit="return addItem(event)">
        <div><label>Name</label><input id="n" required placeholder="Detroit Style Pizza" /></div>
        <div><label>Price</label><input id="p" required type="number" step="0.01" placeholder="18.99" /></div>
        <div>
          <label>Category</label>
          <select id="c">
            <option>Famous Pizza</option>
            <option>Specialty Pizza</option>
            <option>Famous Italian Subs</option>
            <option>Wings</option>
            <option>Sides</option>
            <option>Beverages</option>
          </select>
        </div>
        <div>
          <label>Availability</label>
          <select id="a"><option>Available</option><option>86'd</option></select>
        </div>
        <div class="full"><label>Description</label><textarea id="d" placeholder="Short kitchen note"></textarea></div>
        <div class="full"><button class="btn btn-red btn-sm" type="submit">Add item</button></div>
      </form>
    </section>
  </main>
  <div class="toast" id="toast"></div>
  <script src="js/app.js"></script>
  <script>
    if (!OwnHub.requireAuth()) throw new Error("auth");
    const id = OwnHub.qs("id") || "HARRISON-001";
    const store = OwnHub.findStore(id) || { id, name: OwnHub.qs("name") || "Harrison Township", status: "live" };
    document.getElementById("shell").innerHTML = OwnHub.storeHeader(store, "menu");

    const KEY = "ownhub.menu." + store.id;
    const SEED = [
      { name: "Detroit Style Pizza", price: 18.99, category: "Famous Pizza", avail: "Available" },
      { name: "The Torpedo 12\"", price: 12.99, category: "Famous Italian Subs", avail: "Available" },
      { name: "Square Cheese Tray", price: 9.99, category: "Sides", avail: "Available" },
      { name: "Chicken Wings", price: 11.99, category: "Wings", avail: "Available" },
      { name: "Mozzarella Sticks", price: 7.99, category: "Sides", avail: "Available" }
    ];
    let items = JSON.parse(localStorage.getItem(KEY) || "null") || SEED;

    function save() { localStorage.setItem(KEY, JSON.stringify(items)); }
    function render() {
      document.getElementById("list").innerHTML = items.map((it, i) => `
        <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)">
          <div>
            <strong>${it.name}</strong>
            <div class="meta">${it.category} · ${it.avail}</div>
          </div>
          <div style="display:flex;align-items:center;gap:10px">
            <strong>${OwnHub.money2(it.price)}</strong>
            <button class="btn btn-ghost btn-sm" type="button" onclick="removeItem(${i})">Delete</button>
          </div>
        </div>`).join("");
    }
    function addItem(e) {
      e.preventDefault();
      items.unshift({
        name: document.getElementById("n").value.trim(),
        price: Number(document.getElementById("p").value),
        category: document.getElementById("c").value,
        avail: document.getElementById("a").value
      });
      save(); render(); OwnHub.toast("Item added");
      e.target.reset();
      return false;
    }
    function removeItem(i) { items.splice(i, 1); save(); render(); }
    render();
  </script>
</body>
</html>
